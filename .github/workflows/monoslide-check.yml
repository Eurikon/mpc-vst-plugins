name: MonoSlide checks
on:
  push:
    paths: ['Monoslide/**', '.github/workflows/monoslide-check.yml']
  pull_request:
    paths: ['Monoslide/**', '.github/workflows/monoslide-check.yml']
permissions:
  contents: read
jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: port
      - uses: actions/checkout@v4
        with:
          repository: sd88me/mpc-vst-plugins
          ref: fc1ea20ff83779d3f47fb43177f5284f59e57a99
          path: mpc-vst-plugins
      - name: Sanitizer and catalog registry checks
        working-directory: port/Monoslide
        env:
          MPC_VST: ${{ github.workspace }}/mpc-vst-plugins
        run: |
          ./test.sh
          python3 "$MPC_VST/tools/catalog_build.py" --registry catalog --check-registry
