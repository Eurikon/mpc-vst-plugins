name: MonoSlide draft release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version X.Y.Z
        required: true
        type: string
      dry_run:
        description: Only upload workflow artifacts
        default: true
        type: boolean
jobs:
  checks:
    uses: ./.github/workflows/monoslide-check.yml
    permissions:
      contents: read
  vst:
    needs: checks
    uses: open-mpc/mpc-vst-plugins/.github/workflows/vst-release.yml@0dc17120cd7e952e95eeecdd820ac9e495a75ee9
    permissions:
      contents: write
    with:
      tag: monoslide-v${{ inputs.version }}
      version: ${{ inputs.version }}
      tools_ref: 0dc17120cd7e952e95eeecdd820ac9e495a75ee9
      vst_dir: Instruments/Monoslide
      build: ./Instruments/Monoslide/build.sh && ./Instruments/Monoslide/package.sh ${{ inputs.version }}
      host_test: ./Instruments/Monoslide/test.sh
      plugin_id: monoslide
      license: GPL-3.0-or-later
      extra: Instruments/Monoslide/LICENSE:LICENSE Instruments/Monoslide/licenses:licenses
      about: "Monophonic acid bass instrument for MPC standalone."
      dry_run: ${{ inputs.dry_run }}
